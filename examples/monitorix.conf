# Monitorix-py Configuration File
# This is a sample configuration file for Monitorix-py

# Global settings
title = Monitorix-py System Monitoring
hostname = 
theme_color = white
refresh_rate = 60

# Base directory for storing graphs and data
base_dir = /var/lib/monitorix
base_lib = /usr/lib/monitorix
base_url = /monitorix
base_cgi = /monitorix-cgi

# Log settings
log_file = /var/log/monitorix
<graph_enable>
    system = y
    fs = y
    net = y
    disk = y
</graph_enable>

# System monitoring settings
<system>
    # Enable system monitoring
    enabled = y
    
    # Collection interval in seconds
    interval = 60
</system>

# Filesystem monitoring settings
<fs>
    # Enable filesystem monitoring
    enabled = y
    
    # Filesystems to monitor (comma-separated)
    # Leave empty to monitor all
    list = 
    
    # Enable rigid graphs
    rigid = 2
</fs>

# Network monitoring settings
<net>
    # Enable network monitoring
    enabled = y
    
    # Network interfaces to monitor (comma-separated)
    # Leave empty to monitor all
    list = 
</net>

# Disk monitoring settings
<disk>
    # Enable disk monitoring
    enabled = y
    
    # Disks to monitor (comma-separated)
    # Leave empty to monitor all
    list = 
</disk>

# HTTP server settings (for built-in web server)
<httpd_builtin>
    enabled = n
    host = 
    port = 8080
    user = nobody
    group = nobody
    log_file = /var/log/monitorix-httpd
    hosts_deny = 
    hosts_allow = 
</httpd_builtin>
